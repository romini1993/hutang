<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catatan Hutang</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#090a10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hutang">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/10369/10369894.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        html, body { width: 100%; min-height: 100vh; margin: 0; background: #090a10; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
        .porto-card { background: #10121d; border: 1px solid #1e2235; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
        .porto-input { background: #090a10; border: 1px solid #23273c; color: #f1f5f9; }
        .porto-input:focus { border-color: #f43f5e; outline: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #23273c; border-radius: 8px; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise-in { animation: riseIn .3s ease-out both; }

        /* Hide default details arrow */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        /* Toast Animation */
        #toast {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
            opacity: 0;
            z-index: 9999;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body class="p-3 md:p-6 flex justify-center pb-20">
    <div class="w-full max-w-[1600px] grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        
        <!-- KOLOM KIRI: Header & Form -->
        <div class="lg:col-span-4 space-y-5 lg:sticky lg:top-6">
            <div class="porto-card px-4 py-3 rounded-xl flex items-center gap-2.5 border-l-4 border-l-rose-500">
                <div class="w-8 h-8 rounded-lg bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 font-bold text-base">
                    💸
                </div>
                <div>
                    <h1 class="font-display text-base font-bold text-white tracking-tight leading-none">CATATAN HUTANG</h1>
                    <p class="text-[10px] text-slate-400 mt-0.5">Catatan Pinjaman & Kas</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="porto-card p-4 rounded-xl text-center">
                    <div class="text-[10px] uppercase font-semibold text-slate-400 mb-1">Total Hutang Aktif</div>
                    <div id="statTotalHutang" class="num text-base font-bold text-rose-400">Rp 0</div>
                </div>
                <div class="porto-card p-4 rounded-xl text-center">
                    <div class="text-[10px] uppercase font-semibold text-slate-400 mb-1">Jumlah Transaksi</div>
                    <div id="statCount" class="num text-base font-bold text-slate-200">0</div>
                </div>
            </div>

            <form id="hutangForm" onsubmit="handleSubmit(event)" class="porto-card p-5 rounded-2xl space-y-4" autocomplete="off">
                <h2 class="text-xs font-bold uppercase tracking-wider text-rose-400">Input Pinjaman / Cicilan</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tanggal</label>
                    <input type="text" id="tanggal" required class="w-full porto-input rounded-xl px-3.5 py-2.5" autocomplete="off">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Siapa yang Pinjam</label>
                    <input type="text" id="peminjam" required placeholder="Input Nama" 
                           autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                           oninput="handlePeminjamInput(this)" class="w-full porto-input rounded-xl px-3.5 py-2.5 font-medium">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Via / Pembayaran</label>
                    <div class="relative w-full">
                        <div id="ghostVia" class="absolute inset-0 px-3.5 py-2.5 pointer-events-none text-slate-500 font-medium whitespace-pre overflow-hidden"></div>
                        <input type="text" id="via" required placeholder="Contoh: Seabank, Dana, BCA, Cash" 
                               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                               oninput="handleViaInput(this)" 
                               onkeydown="handleViaKeyDown(event, this)" 
                               onblur="acceptViaSuggestion(this)" 
                               class="w-full porto-input rounded-xl px-3.5 py-2.5 relative bg-transparent z-10">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nominal (Rp) <span class="text-[10px] text-slate-500">(pakai - untuk cicil/bayar)</span></label>
                    <input type="text" id="nominal" inputmode="decimal" required placeholder="50.000 atau -20.000" 
                           autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                           oninput="formatInputRibuan(this)" class="w-full porto-input rounded-xl px-3.5 py-2.5 num">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-rose-600/20">
                    Simpan Catatan
                </button>
            </form>
        </div>

        <!-- KOLOM KANAN: Daftar Grouping & Tabs -->
        <div class="lg:col-span-8 space-y-4 lg:sticky lg:top-6">
            <div class="porto-card p-5 rounded-2xl space-y-4 min-h-[500px]">
                
                <!-- Tab Pilihan -->
                <div class="flex p-1 bg-[#090a10] rounded-xl border border-[#23273c] relative">
                    <button onclick="switchTab('aktif')" id="tabAktif" class="flex-1 py-2 text-sm font-bold text-rose-400 bg-[#1e2235] rounded-lg transition-all z-10 shadow">Hutang Aktif</button>
                    <button onclick="switchTab('riwayat')" id="tabRiwayat" class="flex-1 py-2 text-sm font-bold text-slate-500 rounded-lg transition-all z-10 hover:text-slate-300">Riwayat</button>
                </div>

                <div class="flex justify-between items-center px-1">
                    <h2 id="listHeaderTitle" class="text-xs font-bold uppercase tracking-wider text-rose-400">Daftar Hutang Aktif</h2>
                    <div id="loading" class="text-xs text-amber-400 hidden animate-pulse">Memuat data dari Sheet...</div>
                </div>
                
                <!-- Container List -->
                <div id="groupedListContainer" class="space-y-3 max-h-[calc(100vh-220px)] overflow-y-auto pr-1 custom-scroll">
                    <!-- List dirender lewat JavaScript -->
                </div>

            </div>
        </div>
    </div>

    <!-- POPUP MODAL HAPUS -->
    <div id="deleteModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="porto-card w-full max-w-sm p-6 rounded-2xl border border-rose-500/30 shadow-2xl space-y-4 rise-in text-center relative">
            <div class="w-12 h-12 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto">
                ⚠️
            </div>
            <div>
                <h3 class="font-display font-bold text-white text-base mb-1">Hapus / Lunas Pinjaman</h3>
                <p id="deleteModalText" class="text-xs text-slate-400">Yakin mau hapus catatan pinjaman ini?</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeDeleteModal()" class="w-1/2 bg-[#1e2235] hover:bg-[#282d47] text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition">
                    Batal (Esc)
                </button>
                <button type="button" id="confirmDeleteBtn" class="w-1/2 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-rose-600/20 focus:outline-none focus:ring-2 focus:ring-rose-400">
                    Ya, Hapus (Enter)
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2">
        <span id="toastIcon"></span>
        <span id="toastText"></span>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzFDDLFAnahJ7lETXrLTQQApqvQDHCTePOWZUt5ppYYSYDcT9eNk2aZKzCxoINXun7x/exec";
        const LOCAL_STORAGE_KEY = "hutang_cached_data";
        const VIA_OPTIONS = ["Seabank", "Dana", "BCA", "Cash", "GoPay", "OVO", "Mandiri", "BRI", "ShopeePay"];

        let globalData = [];
        let activeTab = 'aktif'; 
        let deleteTargetNo = null;
        let deleteTargetPerson = null; 
        let currentSuggestion = "";
        let toastTimeout = null;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker Registered'))
                    .catch(err => console.log('SW Registration failed: ', err));
            });
        }

        flatpickr("#tanggal", { dateFormat: "d/m/Y", defaultDate: "today" });

        window.onload = function() {
            const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (cached) {
                try {
                    globalData = JSON.parse(cached);
                    renderData();
                } catch(e) {}
            }
            loadData();
        };

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastText');

            if (toastTimeout) clearTimeout(toastTimeout);

            text.innerText = message;

            if (type === 'success') {
                icon.innerText = '✓';
                toast.className = "px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2 bg-emerald-500/20 border-emerald-500/40 text-emerald-300 show";
            } else {
                icon.innerText = '✕';
                toast.className = "px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2 bg-rose-500/20 border-rose-500/40 text-rose-300 show";
            }

            toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function handlePeminjamInput(input) { input.value = input.value.toUpperCase(); }
        function capitalizeWords(str) { return str.replace(/\b\w/g, l => l.toUpperCase()); }

        function handleViaInput(input) {
            let val = input.value;
            const ghost = document.getElementById('ghostVia');
            currentSuggestion = "";

            if (val.trim() !== "") {
                val = capitalizeWords(val);
                input.value = val;
                const match = VIA_OPTIONS.find(opt => opt.toLowerCase().startsWith(val.toLowerCase()));
                if (match) {
                    currentSuggestion = match;
                    const typedPart = val;
                    const ghostPart = match.slice(typedPart.length);
                    ghost.innerHTML = `<span class="opacity-0">${typedPart}</span><span>${ghostPart}</span>`;
                    return;
                }
            }
            ghost.innerHTML = "";
        }

        function handleViaKeyDown(e, input) {
            if ((e.key === 'Tab' || e.key === 'Enter' || e.key === 'ArrowRight') && currentSuggestion) {
                if (input.value.toLowerCase() !== currentSuggestion.toLowerCase()) {
                    e.preventDefault();
                    input.value = currentSuggestion;
                    document.getElementById('ghostVia').innerHTML = "";
                    currentSuggestion = "";
                }
            }
        }

        function acceptViaSuggestion(input) {
            if (currentSuggestion && input.value.trim() !== "") {
                input.value = currentSuggestion;
            } else if (input.value.trim() !== "") {
                input.value = capitalizeWords(input.value);
            }
            document.getElementById('ghostVia').innerHTML = "";
            currentSuggestion = "";
        }

        function formatInputRibuan(input) {
            let isNegative = input.value.trim().startsWith('-');
            let value = input.value.replace(/\D/g, '');
            if (value) {
                let formatted = new Intl.NumberFormat('id-ID').format(value);
                input.value = isNegative ? '-' + formatted : formatted;
            } else {
                input.value = isNegative ? '-' : '';
            }
        }

        function formatRupiah(val) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        }

        function parseTanggalCustom(tglStr) {
            if (!tglStr) return 0;
            let parts = tglStr.split('/');
            if (parts.length === 3) {
                return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`).getTime();
            }
            return new Date(tglStr).getTime() || 0;
        }

        function cleanTanggal(tglStr) {
            if (!tglStr) return '-';
            if (typeof tglStr === 'string' && tglStr.includes('T')) {
                const d = new Date(tglStr);
                if (!isNaN(d.getTime())) {
                    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
                }
            }
            return tglStr;
        }

        function loadData() {
            if (globalData.length === 0) document.getElementById('loading').classList.remove('hidden');
            fetch(API_URL + "?action=read")
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').classList.add('hidden');
                    globalData = data;
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
                    renderData();
                })
                .catch(() => { document.getElementById('loading').innerText = "Gagal memuat data."; });
        }

        function switchTab(tab) {
            activeTab = tab;
            const btnAktif = document.getElementById('tabAktif');
            const btnRiwayat = document.getElementById('tabRiwayat');
            const headerTitle = document.getElementById('listHeaderTitle');

            if(tab === 'aktif') {
                btnAktif.className = "flex-1 py-2 text-sm font-bold text-rose-400 bg-[#1e2235] rounded-lg transition-all z-10 shadow";
                btnRiwayat.className = "flex-1 py-2 text-sm font-bold text-slate-500 rounded-lg transition-all z-10 hover:text-slate-300";
                headerTitle.innerText = "Daftar Hutang Aktif";
            } else {
                btnRiwayat.className = "flex-1 py-2 text-sm font-bold text-amber-400 bg-[#1e2235] rounded-lg transition-all z-10 shadow";
                btnAktif.className = "flex-1 py-2 text-sm font-bold text-slate-500 rounded-lg transition-all z-10 hover:text-slate-300";
                headerTitle.innerText = "Semua Riwayat Transaksi";
            }
            renderData();
        }

        function renderData() {
            const container = document.getElementById('groupedListContainer');
            container.innerHTML = '';
            
            let totalAkumulasiAktif = 0;
            document.getElementById('statCount').innerText = globalData.length;

            if (activeTab === 'aktif') {
                let rekapPeminjam = {};

                globalData.forEach(item => {
                    const nama = (item.peminjam || 'TANPA NAMA').toUpperCase().trim();
                    const nom = parseFloat(item.nominal || 0);

                    if (!rekapPeminjam[nama]) {
                        rekapPeminjam[nama] = { total: 0, items: [] };
                    }
                    rekapPeminjam[nama].total += nom;
                    rekapPeminjam[nama].items.push(item);
                });

                let htmlString = '';
                let groupKeys = Object.keys(rekapPeminjam).filter(nama => {
                    const total = rekapPeminjam[nama].total;
                    if (total > 0) totalAkumulasiAktif += total;
                    return total > 0;
                });

                document.getElementById('statTotalHutang').innerText = formatRupiah(totalAkumulasiAktif);

                if (groupKeys.length === 0) {
                    container.innerHTML = `<div class="text-center text-xs text-slate-500 py-10">Belum ada catatan hutang aktif.</div>`;
                    return;
                }

                groupKeys.forEach(nama => {
                    const data = rekapPeminjam[nama];
                    const isLunas = data.total <= 0;
                    
                    data.items.sort((a,b) => b.no - a.no);

                    htmlString += `
                    <details class="bg-[#10121d] border border-[#1e2235] rounded-xl mb-3 overflow-hidden group">
                        <summary class="flex justify-between items-center p-4 cursor-pointer outline-none hover:bg-[#161925] transition-colors">
                            <div class="flex flex-col">
                                <span class="font-bold text-slate-200 text-sm">${nama}</span>
                                <span class="text-[10px] text-slate-500">${data.items.length} transaksi</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="font-display font-bold num text-sm ${isLunas ? 'text-emerald-400' : 'text-rose-400'}">
                                    ${formatRupiah(data.total)}
                                </span>
                                <button onclick="openDeleteModal(event, null, '${nama}', null, true)" class="bg-rose-500/10 text-rose-500 border border-rose-500/20 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-rose-600 hover:text-white transition-colors">
                                    Lunas / Hapus
                                </button>
                                <span class="text-slate-500 text-xs group-open:rotate-180 transition-transform">▼</span>
                            </div>
                        </summary>
                        
                        <div class="px-4 pb-4 pt-2 border-t border-[#1e2235]/50 bg-[#090a10]">
                            ${data.items.map(item => `
                                <div class="flex justify-between items-center py-2.5 border-b border-[#1e2235]/30 last:border-0">
                                    <div class="flex flex-col">
                                        <span class="text-[11px] text-slate-400">#${item.no} •${cleanTanggal(item.tanggal)}</span>
                                        <span class="text-xs text-slate-200 font-medium">${item.via || '-'}</span>
                                    </div>
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold num ${item.nominal < 0 ? 'text-emerald-400' : 'text-rose-400'}">
                                            ${formatRupiah(item.nominal)}
                                        </span>
                                        <button onclick="openDeleteModal(event, ${item.no}, '${item.peminjam}', '${formatRupiah(item.nominal)}', false)" class="text-[10px] bg-[#1e2235] text-slate-400 hover:text-rose-400 px-2 py-1 rounded transition">❌</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </details>`;
                });
                container.innerHTML = htmlString;

            } else {
                globalData.forEach(item => { totalAkumulasiAktif += parseFloat(item.nominal || 0); });
                document.getElementById('statTotalHutang').innerText = formatRupiah(totalAkumulasiAktif);

                let historyData = [...globalData].sort((a, b) => {
                    let timeA = parseTanggalCustom(a.tanggal);
                    let timeB = parseTanggalCustom(b.tanggal);
                    if (timeB === timeA) return b.no - a.no;
                    return timeB - timeA;
                });

                if (historyData.length === 0) {
                    container.innerHTML = `<div class="text-center text-xs text-slate-500 py-10">Belum ada riwayat transaksi.</div>`;
                    return;
                }

                let htmlString = '<div class="space-y-2">';
                historyData.forEach(item => {
                    const nom = parseFloat(item.nominal || 0);
                    const isBayar = nom < 0;
                    
                    htmlString += `
                    <div class="p-3 bg-[#10121d] border border-[#1e2235] rounded-xl flex justify-between items-center group hover:border-slate-700 transition">
                        <div>
                            <div class="flex flex-col">
                                <span class="text-sm font-bold text-slate-200">${item.peminjam || '-'}</span>
                                <span class="text-[11px] text-slate-400">#${item.no} • ${item.tanggal} • <span class="${isBayar ? 'text-emerald-400' : 'text-rose-400'} font-medium">${item.via || '-'}</span></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="num font-bold text-sm ${isBayar ? 'text-emerald-400' : 'text-rose-400'} text-right w-24">
                                ${formatRupiah(nom)}
                            </div>
                            <button onclick="openDeleteModal(event, ${item.no}, '${item.peminjam}', '${formatRupiah(nom)}', false)" class="text-[10px] bg-[#1e2235] text-slate-400 hover:text-rose-400 px-2 py-1.5 rounded transition">❌</button>
                        </div>
                    </div>`;
                });
                htmlString += '</div>';
                container.innerHTML = htmlString;
            }
        }

        function handleSubmit(e) {
            e.preventDefault();
            const tgl = document.getElementById('tanggal').value;
            const peminjam = document.getElementById('peminjam').value.toUpperCase().trim();
            const via = document.getElementById('via').value.trim();
            
            let valStr = document.getElementById('nominal').value.trim();
            let isNegative = valStr.startsWith('-');
            let cleanVal = valStr.replace(/\D/g, '');
            let rawNominal = isNegative ? '-' + cleanVal : cleanVal;
            const nomNum = parseFloat(rawNominal || 0);

            const newItem = {
                no: (globalData.length > 0 ? Math.max(...globalData.map(i => i.no)) : 0) + 1,
                tanggal: tgl,
                peminjam: peminjam,
                via: via,
                nominal: nomNum
            };

            globalData.push(newItem);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(globalData));
            
            if(activeTab === 'riwayat' && nomNum > 0) switchTab('aktif'); 
            else renderData();

            showToast("Tersimpan", "success");

            document.getElementById('peminjam').value = '';
            document.getElementById('via').value = '';
            document.getElementById('nominal').value = '';

            const encTgl = encodeURIComponent(tgl);
            const encPeminjam = encodeURIComponent(peminjam);
            const encVia = encodeURIComponent(via);
            const encNom = encodeURIComponent(rawNominal);

            // Tambahin no-cors biar ga error diblok browser
            fetch(`${API_URL}?action=add&tanggal=${encTgl}&peminjam=${encPeminjam}&via=${encVia}&nominal=${encNom}`, { mode: 'no-cors' })
                .then(() => loadData())
                .catch(() => loadData()); 
        }

        function openDeleteModal(e, no, peminjam, nominalStr, isDeleteAll = false) {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            deleteTargetNo = no;
            deleteTargetPerson = isDeleteAll ? peminjam : null;

            if (isDeleteAll) {
                document.getElementById('deleteModalText').innerText = `Yakin mau hapus/lunasin SEMUA catatan atas nama ${peminjam}? Data bakal terhapus permanen.`;
            } else {
                document.getElementById('deleteModalText').innerText = `Hapus catatan pinjaman ${peminjam} sebesar ${nominalStr}?`;
            }

            const modal = document.getElementById('deleteModal');
            modal.classList.remove('hidden');
            setTimeout(() => document.getElementById('confirmDeleteBtn').focus(), 50);
        }

        function closeDeleteModal() {
            deleteTargetNo = null;
            deleteTargetPerson = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        window.addEventListener('keydown', function(e) {
            const modal = document.getElementById('deleteModal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('confirmDeleteBtn').click();
                } else if (e.key === 'Escape') {
                    closeDeleteModal();
                }
            }
        });

        // LOGIKA HAPUS YANG BARU (Pake antrian biar Google Sheet ngga nge-hang/salah hapus)
        document.getElementById('confirmDeleteBtn').onclick = async function() {
            closeDeleteModal();

            if (deleteTargetPerson) {
                // Kalo hapus semua: kita urutin nomor baris (no) dari yg TERBESAR (Paling bawah di sheet) ke TERKECIL
                // Tujuannya biar pas dihapus satu-satu, posisi baris yg belum dihapus ngga kegeser-geser.
                const itemsToDelete = globalData.filter(item => (item.peminjam || '').toUpperCase().trim() === deleteTargetPerson);
                const nosToDelete = itemsToDelete.map(i => i.no).sort((a, b) => b - a);

                // Hapus di lokal biar instan di UI
                globalData = globalData.filter(item => (item.peminjam || '').toUpperCase().trim() !== deleteTargetPerson);
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(globalData));
                renderData();
                showToast(`Data ${deleteTargetPerson} terhapus`, "success");

                // Request ke sheet ngantri 1 per 1 nunggu yg sebelumnya selesai (await)
                for (let no of nosToDelete) {
                    try {
                        await fetch(`${API_URL}?action=delete&no=${no}`, { mode: 'no-cors' });
                    } catch(err) { console.error(err); }
                }
                loadData();

            } else if (deleteTargetNo !== null) {
                // Kalo hapus satuan
                const targetNo = deleteTargetNo;
                
                globalData = globalData.filter(item => item.no !== targetNo);
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(globalData));
                renderData();
                showToast("Terhapus", "success");

                try {
                    await fetch(`${API_URL}?action=delete&no=${targetNo}`, { mode: 'no-cors' });
                } catch(err) { console.error(err); }
                
                loadData();
            }
        };
    </script>
</body>
</html>
