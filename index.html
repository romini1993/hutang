<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catatan Hutang</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#090a10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hutang">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/10369/10369894.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        html, body { width: 100%; min-height: 100vh; margin: 0; background: #090a10; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
        .porto-card { background: #10121d; border: 1px solid #1e2235; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
        .porto-input { background: #090a10; border: 1px solid #23273c; color: #f1f5f9; }
        .porto-input:focus { border-color: #f43f5e; outline: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #23273c; border-radius: 8px; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise-in { animation: riseIn .3s ease-out both; }
    </style>
</head>
<body class="p-3 md:p-6 flex justify-center">
    <div class="w-full max-w-[1600px] grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        
        <!-- KOLOM KIRI: Header & Form -->
        <div class="lg:col-span-4 space-y-5 lg:sticky lg:top-6">
            <!-- Header Dikecilin (Compact Style) -->
            <div class="porto-card px-4 py-3 rounded-xl flex items-center gap-2.5 border-l-4 border-l-rose-500">
                <div class="w-8 h-8 rounded-lg bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 font-bold text-base">
                    💸
                </div>
                <div>
                    <h1 class="font-display text-base font-bold text-white tracking-tight leading-none">CATATAN HUTANG</h1>
                    <p class="text-[10px] text-slate-400 mt-0.5">Catatan Pinjaman & Kas</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="porto-card p-4 rounded-xl text-center">
                    <div class="text-[10px] uppercase font-semibold text-slate-400 mb-1">Total Hutang</div>
                    <div id="statTotalHutang" class="num text-base font-bold text-rose-400">Rp 0</div>
                </div>
                <div class="porto-card p-4 rounded-xl text-center">
                    <div class="text-[10px] uppercase font-semibold text-slate-400 mb-1">Jumlah Catatan</div>
                    <div id="statCount" class="num text-base font-bold text-slate-200">0</div>
                </div>
            </div>

            <form id="hutangForm" onsubmit="handleSubmit(event)" class="porto-card p-5 rounded-2xl space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-rose-400">Input Pinjaman / Cicilan</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tanggal</label>
                    <input type="text" id="tanggal" required class="w-full porto-input rounded-xl px-3.5 py-2.5">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Siapa yang Pinjam</label>
                    <input type="text" id="peminjam" required placeholder="Contoh: Gua / Nama Teman" class="w-full porto-input rounded-xl px-3.5 py-2.5">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Via / Pembayaran</label>
                    <input type="text" id="via" required placeholder="Contoh: Cash, BCA, DANA, GoPay" class="w-full porto-input rounded-xl px-3.5 py-2.5">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nominal (Rp) <span class="text-[10px] text-slate-500">(pakai - untuk cicil/bayar)</span></label>
                    <input type="text" id="nominal" required placeholder="50.000 atau -20.000" oninput="formatInputRibuan(this)" class="w-full porto-input rounded-xl px-3.5 py-2.5 num">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-rose-600/20">
                    Simpan Catatan
                </button>
            </form>
        </div>

        <!-- KOLOM TENGAH: Rekap Per Peminjam -->
        <div class="lg:col-span-4 space-y-4 lg:sticky lg:top-6">
            <div class="porto-card p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-rose-400">Ringkasan</h2>
                    <span class="text-[10px] text-slate-400">Klik nama untuk filter</span>
                </div>
                <div id="summaryBox" class="text-xs text-slate-300 space-y-2"></div>
            </div>
        </div>

        <!-- KOLOM KANAN: Daftar Riwayat -->
        <div class="lg:col-span-4 space-y-4 lg:sticky lg:top-6">
            <div class="porto-card p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center mb-2">
                    <h2 id="listHeaderTitle" class="text-xs font-bold uppercase tracking-wider text-rose-400">Daftar Pinjaman</h2>
                    <button id="resetFilterBtn" onclick="filterByPerson(null)" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded hidden border border-slate-700">
                        🔄 Semua Nama
                    </button>
                </div>
                <div id="loading" class="text-center text-xs text-slate-500 py-6 hidden">Memuat data dari Sheet...</div>
                <div id="hutangList" class="space-y-2 max-h-[calc(100vh-140px)] overflow-y-auto pr-1 custom-scroll"></div>
            </div>
        </div>
    </div>

    <!-- POPUP MODAL HAPUS MODERN (ENTER-ENABLED) -->
    <div id="deleteModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="porto-card w-full max-w-sm p-6 rounded-2xl border border-rose-500/30 shadow-2xl space-y-4 rise-in text-center relative">
            <div class="w-12 h-12 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto">
                ⚠️
            </div>
            <div>
                <h3 class="font-display font-bold text-white text-base mb-1">Hapus / Lunas Pinjaman</h3>
                <p id="deleteModalText" class="text-xs text-slate-400">Yakin mau hapus catatan pinjaman ini?</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeDeleteModal()" class="w-1/2 bg-[#1e2235] hover:bg-[#282d47] text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition">
                    Batal (Esc)
                </button>
                <button type="button" id="confirmDeleteBtn" class="w-1/2 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-rose-600/20 focus:outline-none focus:ring-2 focus:ring-rose-400">
                    Ya, Hapus (Enter)
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzFDDLFAnahJ7lETXrLTQQApqvQDHCTePOWZUt5ppYYSYDcT9eNk2aZKzCxoINXun7x/exec";
        const LOCAL_STORAGE_KEY = "hutang_cached_data";

        let globalData = [];
        let selectedFilterName = null;
        let deleteTargetNo = null;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker Registered'))
                    .catch(err => console.log('SW Registration failed: ', err));
            });
        }

        flatpickr("#tanggal", { dateFormat: "d/m/Y", defaultDate: "today" });

        window.onload = function() {
            // Instant Load dari Cache Lokal Dulu (Secepat CopyTrade)
            const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (cached) {
                try {
                    globalData = JSON.parse(cached);
                    renderData();
                } catch(e) {}
            }
            loadData();
        };

        function formatInputRibuan(input) {
            let isNegative = input.value.trim().startsWith('-');
            let value = input.value.replace(/\D/g, '');
            if (value) {
                let formatted = new Intl.NumberFormat('id-ID').format(value);
                input.value = isNegative ? '-' + formatted : formatted;
            } else {
                input.value = isNegative ? '-' : '';
            }
        }

        function formatRupiah(val) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        }

        function cleanTanggal(tglStr) {
            if (!tglStr) return '-';
            if (typeof tglStr === 'string' && tglStr.includes('T')) {
                const d = new Date(tglStr);
                if (!isNaN(d.getTime())) {
                    const day = String(d.getDate()).padStart(2, '0');
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const year = d.getFullYear();
                    return `${day}/${month}/${year}`;
                }
            }
            return tglStr;
        }

        function loadData() {
            if (globalData.length === 0) {
                document.getElementById('loading').classList.remove('hidden');
            }
            fetch(API_URL + "?action=read")
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').classList.add('hidden');
                    globalData = data;
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
                    renderData();
                })
                .catch(() => {
                    document.getElementById('loading').innerText = "Gagal memuat data.";
                });
        }

        function filterByPerson(nama) {
            selectedFilterName = nama;
            renderData();
        }

        function renderData() {
            const listEl = document.getElementById('hutangList');
            const summaryEl = document.getElementById('summaryBox');
            const headerTitle = document.getElementById('listHeaderTitle');
            const resetBtn = document.getElementById('resetFilterBtn');

            listEl.innerHTML = '';
            summaryEl.innerHTML = '';
            
            let totalAkumulasi = 0;
            let rekapPeminjam = {};

            globalData.forEach(item => {
                const nom = parseFloat(item.nominal || 0);
                totalAkumulasi += nom;

                const nama = (item.peminjam || 'TANPA NAMA').toUpperCase().trim();
                if (!rekapPeminjam[nama]) {
                    rekapPeminjam[nama] = 0;
                }
                rekapPeminjam[nama] += nom;
            });

            document.getElementById('statTotalHutang').innerText = formatRupiah(totalAkumulasi);
            document.getElementById('statCount').innerText = globalData.length;

            const keys = Object.keys(rekapPeminjam);
            if (keys.length === 0) {
                summaryEl.innerHTML = `<div class="p-3 bg-[#090a10] rounded-xl border border-[#23273c] text-slate-500 text-center">Belum ada catatan.</div>`;
            } else {
                keys.forEach(nama => {
                    const isSelected = selectedFilterName === nama;
                    const totalNom = rekapPeminjam[nama];
                    const box = document.createElement('div');
                    box.className = `p-3 rounded-xl border cursor-pointer transition flex justify-between items-center ${
                        isSelected 
                        ? 'bg-rose-500/10 border-rose-500 text-white font-bold ring-1 ring-rose-500' 
                        : 'bg-[#090a10] border-[#23273c] hover:border-slate-600 text-slate-200'
                    }`;
                    box.onclick = () => filterByPerson(isSelected ? null : nama);
                    box.innerHTML = `
                        <span class="font-semibold">${nama}</span>
                        <b class="${totalNom < 0 ? 'text-emerald-400' : 'text-rose-400'} font-bold num text-sm">${formatRupiah(totalNom)}</b>
                    `;
                    summaryEl.appendChild(box);
                });
            }

            let filteredData = globalData;
            if (selectedFilterName) {
                filteredData = globalData.filter(item => (item.peminjam || '').toUpperCase().trim() === selectedFilterName);
                headerTitle.innerText = `Pinjaman: ${selectedFilterName}`;
                resetBtn.classList.remove('hidden');
            } else {
                headerTitle.innerText = "Daftar Pinjaman";
                resetBtn.classList.add('hidden');
            }

            if (filteredData.length === 0) {
                listEl.innerHTML = `<div class="text-center text-xs text-slate-500 py-6">Tidak ada catatan pinjaman.</div>`;
                return;
            }

            const reversedData = filteredData.slice().reverse();

            reversedData.forEach((item, index) => {
                const nom = parseFloat(item.nominal || 0);
                const noDisplay = reversedData.length - index;
                const isBayar = nom < 0;

                const card = document.createElement('div');
                card.className = "p-3 bg-[#090a10] border border-[#23273c] rounded-xl flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <div class="text-xs text-slate-400">#${noDisplay} • ${cleanTanggal(item.tanggal)} • <span class="${isBayar ? 'text-emerald-400' : 'text-rose-400'} font-medium">${item.via || '-'}</span></div>
                        <div class="text-sm font-semibold text-white">${item.peminjam || '-'}</div>
                    </div>
                    <div class="text-right">
                        <div class="num font-bold ${isBayar ? 'text-emerald-400' : 'text-rose-400'}">${formatRupiah(nom)}</div>
                        <button onclick="openDeleteModal(${item.no}, '${item.peminjam}', '${formatRupiah(nom)}')" class="text-[10px] bg-rose-600/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded mt-1 hover:bg-rose-600/40">Lunas / Hapus</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Menyimpan...";

            const tgl = encodeURIComponent(document.getElementById('tanggal').value);
            const peminjam = encodeURIComponent(document.getElementById('peminjam').value);
            const via = encodeURIComponent(document.getElementById('via').value);
            
            let valStr = document.getElementById('nominal').value.trim();
            let isNegative = valStr.startsWith('-');
            let cleanVal = valStr.replace(/\D/g, '');
            let rawNominal = isNegative ? '-' + cleanVal : cleanVal;
            const nom = encodeURIComponent(rawNominal);

            fetch(`${API_URL}?action=add&tanggal=${tgl}&peminjam=${peminjam}&via=${via}&nominal=${nom}`)
                .then(() => {
                    btn.disabled = false;
                    btn.innerText = "Simpan Catatan";
                    document.getElementById('peminjam').value = '';
                    document.getElementById('via').value = '';
                    document.getElementById('nominal').value = '';
                    loadData();
                });
        }

        // Modal Functions & Keyboard Event Listener (Enter/Esc)
        function openDeleteModal(no, peminjam, nominalStr) {
            deleteTargetNo = no;
            document.getElementById('deleteModalText').innerText = `Hapus catatan pinjaman ${peminjam} sebesar ${nominalStr}?`;
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('hidden');
            
            // Otomatis fokus ke tombol "Ya, Hapus" biar bisa langsung Enter
            setTimeout(() => {
                document.getElementById('confirmDeleteBtn').focus();
            }, 50);
        }

        function closeDeleteModal() {
            deleteTargetNo = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        // Listener Tombol Enter & Esc di Keyboard
        window.addEventListener('keydown', function(e) {
            const modal = document.getElementById('deleteModal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('confirmDeleteBtn').click();
                } else if (e.key === 'Escape') {
                    closeDeleteModal();
                }
            }
        });

        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (deleteTargetNo !== null) {
                const btn = this;
                btn.disabled = true;
                btn.innerText = "Menghapus...";
                fetch(`${API_URL}?action=delete&no=${deleteTargetNo}`)
                    .then(() => {
                        btn.disabled = false;
                        btn.innerText = "Ya, Hapus (Enter)";
                        closeDeleteModal();
                        loadData();
                    });
            }
        };
    </script>
</body>
</html>
